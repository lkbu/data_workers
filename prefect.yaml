name: data-workers
prefect-version: 3.x

# --- FORCE THIS TO BE BLANK ---
# This stops Windows from injecting "D:\dev" into the deployment steps
# Force all automatic path discovery to turn off
build: []
push: []
pull: []

deployments:
- name: "dummy-telegram"
  entrypoint: "core/workers/dummy_telegram.py:my_docker_flow" # Your root file and flow function
  work_pool:
    name: "proxmox-process-pool" # Must match your systemd worker's pool
  
  # 2. FORCE the path to match your VM's project folder explicitly
  path: "/opt/prefect/data_workers"

  # Crucial configuration for local process execution:
  job_variables:
    working_dir: "/opt/prefect/data_workers"
    env:
      PYTHONPATH: "/opt/prefect/data_workers"
  
  # Schedule it to run daily at 7:00 AM (07:00)
  schedule:
    cron: "0 7 * * *"
    timezone: "Europe/Warsaw"

- name: "fx-nbp"
  entrypoint: "core/workers/fx_flow.py:fx_nbp_flow"
  work_pool:
    name: "proxmox-process-pool"
  path: "/opt/prefect/data_workers"
  job_variables:
    working_dir: "/opt/prefect/data_workers"
    env:
      PYTHONPATH: "/opt/prefect/data_workers"
  schedule:
    cron: "15 7 * * *"
    timezone: "Europe/Warsaw"

- name: "fx-ecb"
  entrypoint: "core/workers/fx_flow.py:fx_ecb_flow"
  work_pool:
    name: "proxmox-process-pool"
  path: "/opt/prefect/data_workers"
  job_variables:
    working_dir: "/opt/prefect/data_workers"
    env:
      PYTHONPATH: "/opt/prefect/data_workers"
  schedule:
    cron: "30 7 * * *"
    timezone: "Europe/Warsaw"

- name: "pko-fixed-base-rate"
  entrypoint: "core/workers/pko_flow.py:pko_fixed_base_rate_flow"
  work_pool:
    name: "proxmox-process-pool"
  path: "/opt/prefect/data_workers"
  job_variables:
    working_dir: "/opt/prefect/data_workers"
    env:
      PYTHONPATH: "/opt/prefect/data_workers"
  schedule:
    cron: "45 7 * * *"
    timezone: "Europe/Warsaw"

- name: "stockwatch-dividends"
  entrypoint: "core/workers/dividends.py:dividends_flow"
  work_pool:
    name: "proxmox-process-pool"
  path: "/opt/prefect/data_workers"
  job_variables:
    working_dir: "/opt/prefect/data_workers"
    env:
      PYTHONPATH: "/opt/prefect/data_workers"
  schedule:
    cron: "0 8 * * *"
    timezone: "Europe/Warsaw"