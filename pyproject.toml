[project]
name = "data-workers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "jupyter>=1.1.1",
    "lxml>=6.0.2",
    "pandas>=3.0.1",
    "polars>=1.39.3",
    "prefect>=3.6.24",
    "psycopg2>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.8",
    "sqlalchemy>=2.0.48",
    "ty>=0.0.26",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "db_test: marks tests that require database access",
]
